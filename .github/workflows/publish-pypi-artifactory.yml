name: Publish PyPI package to Artifactory

on:
  push:
    branches: [ master ]
    tags: ['**']

env:
  ARTIFACTORY_REPO_URL: https://common.repositories.cloud.sap/artifactory/api/pypi/sapcli

jobs:
  publish:
    runs-on: [self-hosted, solinas]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m pip install -e ".[dev]"

      - name: Build wheel
        run: make dist

      - name: Configure Artifactory repository
        env:
          ARTIFACTORY_USER: ${{ vars.ARTIFACTORY_USER }}
          ARTIFACTORY_PUBLIC_TOKEN: ${{ secrets.ARTIFACTORY_PUBLIC_TOKEN }}
        run: |
          poetry config repositories.artifactory-sapcli "${ARTIFACTORY_REPO_URL}"
          poetry config http-basic.artifactory-sapcli "${ARTIFACTORY_USER}" "${ARTIFACTORY_PUBLIC_TOKEN}"
          poetry config http-basic.sapcli "${ARTIFACTORY_USER}" "${ARTIFACTORY_PUBLIC_TOKEN}"

      - name: Publish to Artifactory
        run: poetry publish --repository artifactory-sapcli --dist-dir dist
